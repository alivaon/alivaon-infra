# Stack STAGING — déployée dans /opt/alivaon/staging/.
# Domaine : staging.alivaon.com (protégé par basic auth Traefik).
#
# Identique à production mais : routeurs/services suffixés `-staging`,
# volume base distinct (db_data_staging) et middleware basicauth.

services:
  app:
    image: ghcr.io/alivaon/alivaon-symfony:staging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Priment sur les valeurs du .env (modifier le .env recréerait aussi db).
      NEXT_REVALIDATE_URL: http://staging-site:3000/api/revalidate
      ADMIN_URL: https://www.admin.staging.alivaon.com
    volumes:
      - uploads_staging:/var/www/html/public/uploads
      # CV des candidats — HORS docroot, jamais servis par nginx.
      - cv_private_staging:/var/www/html/var/private
    networks:
      traefik_proxy: {}
      # Alias propre à la pile : sur traefik_proxy, « app » désigne aussi le
      # Symfony de production (le DNS Docker renvoie les deux adresses).
      internal:
        aliases:
          - staging-api
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # Route staging + www.staging -> cert Let's Encrypt couvrant les 2 SANs.
      - "traefik.http.routers.alivaon-staging.rule=Host(`staging.alivaon.com`) || Host(`www.staging.alivaon.com`)"
      - "traefik.http.routers.alivaon-staging.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging.tls=true"
      - "traefik.http.routers.alivaon-staging.tls.certresolver=letsencrypt"
      # Redirige staging.alivaon.com -> www.staging.alivaon.com (canonique = www,
      # cohérent avec la prod). L'ancre ^https?://staging\.alivaon\.com/ ne matche
      # pas www.staging (qui commence par "www.") -> pas de boucle.
      # Ordre des middlewares : redirection D'ABORD, puis basic auth.
      - "traefik.http.routers.alivaon-staging.middlewares=staging-canonical,staging-auth,staging-retry"
      - "traefik.http.middlewares.staging-canonical.redirectregex.regex=^https?://staging\\.alivaon\\.com/(.*)"
      - "traefik.http.middlewares.staging-canonical.redirectregex.replacement=https://www.staging.alivaon.com/$${1}"
      - "traefik.http.middlewares.staging-canonical.redirectregex.permanent=true"
      # Basic auth : bloque l'indexation et l'accès public au préprod.
      # Le hash est fourni via .env (STAGING_BASICAUTH), voir .env.example.
      - "traefik.http.middlewares.staging-auth.basicauth.users=${STAGING_BASICAUTH}"
      - "traefik.http.services.alivaon-staging.loadbalancer.server.port=80"
      # Contrôle de Traefik chaque seconde : un conteneur en drain (déploiement
      # sans coupure) ou en panne sort du trafic en ~1 s.
      - "traefik.http.services.alivaon-staging.loadbalancer.healthcheck.path=/ping"
      - "traefik.http.services.alivaon-staging.loadbalancer.healthcheck.interval=1s"
      - "traefik.http.services.alivaon-staging.loadbalancer.healthcheck.timeout=1s"
      # Requête refusée par un conteneur qui s'arrête : rejouée sur l'autre.
      - "traefik.http.middlewares.staging-retry.retry.attempts=3"
      # ── Site et back-office Next.js (docs/next.md) ───────────────────────
      # Le routeur alivaon-staging ci-dessus ne sert plus que de repli : les
      # routeurs de www.staging sont portés par `web`. Symfony sert l'API
      # d'administration sur l'hôte du back-office (priorité haute).
      # www.admin.staging : API d'administration, authentification, images.
      - "traefik.http.routers.alivaon-staging-admin-api.rule=Host(`www.admin.staging.alivaon.com`) && (PathPrefix(`/api/admin`) || PathPrefix(`/api/auth`) || PathPrefix(`/uploads/`))"
      - "traefik.http.routers.alivaon-staging-admin-api.priority=100"
      - "traefik.http.routers.alivaon-staging-admin-api.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging-admin-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-staging-admin-api.middlewares=staging-auth,staging-noindex,staging-retry"
      - "traefik.http.routers.alivaon-staging-admin-api.service=alivaon-staging"
      # En-tête noindex (hôtes de travail et back-office).
      - "traefik.http.middlewares.staging-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ── Site public Next.js (dépôt alivaon-site) ───────────────────────────
  # Même routage que la production (docs/next.md, « Bascule du site »), avec
  # BasicAuth et noindex. Routeurs et middlewares portés par ce service : un
  # redémarrage de Symfony ne les retire pas.
  web:
    image: ghcr.io/alivaon/alivaon-next-site:staging
    restart: unless-stopped
    # Variables explicites (pas d'env_file) : le front ne reçoit ni la base ni
    # les secrets Symfony.
    environment:
      API_INTERNAL_URL: http://staging-api
      SITE_ORIGIN: https://www.staging.alivaon.com
      NEXT_REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET}
    networks:
      traefik_proxy: {}
      # Même raison que pour app : jamais « web » ni « app » entre services.
      internal:
        aliases:
          - staging-site
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.middlewares.staging-web-auth.basicauth.users=${STAGING_BASICAUTH}"
      - "traefik.http.middlewares.staging-web-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"
      - "traefik.http.middlewares.staging-web-canonical.redirectregex.regex=^https?://staging\\.alivaon\\.com/(.*)"
      - "traefik.http.middlewares.staging-web-canonical.redirectregex.replacement=https://www.staging.alivaon.com/$${1}"
      - "traefik.http.middlewares.staging-web-canonical.redirectregex.permanent=true"
      # « //blog » : ramené à « /blog » avant Next (comportement historique).
      - "traefik.http.middlewares.staging-web-slashes.replacepathregex.regex=^/{2,}(.*)"
      - "traefik.http.middlewares.staging-web-slashes.replacepathregex.replacement=/$${1}"
      - "traefik.http.middlewares.staging-web-legacy-admin.redirectregex.regex=^https?://[^/]+/.*"
      - "traefik.http.middlewares.staging-web-legacy-admin.redirectregex.replacement=https://www.admin.staging.alivaon.com/"
      - "traefik.http.middlewares.staging-web-legacy-admin.redirectregex.permanent=true"
      # Déploiement sans coupure (workflow d'alivaon-site) : pendant le
      # remplacement, une requête envoyée au conteneur qui s'arrête (connexion
      # refusée) est rejouée sur le nouveau.
      - "traefik.http.middlewares.staging-web-retry.retry.attempts=3"
      # 1) Tout le reste de www.staging → Next.js. Priorité 80 : au-dessus du
      #    routeur de repli alivaon-staging (priorité implicite 63).
      - "traefik.http.routers.alivaon-staging-web.rule=Host(`staging.alivaon.com`) || Host(`www.staging.alivaon.com`)"
      - "traefik.http.routers.alivaon-staging-web.priority=80"
      - "traefik.http.routers.alivaon-staging-web.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-staging-web.middlewares=staging-web-canonical,staging-web-auth,staging-web-noindex,staging-web-slashes,staging-web-retry"
      - "traefik.http.routers.alivaon-staging-web.service=alivaon-staging-web"
      - "traefik.http.services.alivaon-staging-web.loadbalancer.server.port=3000"
      # Contrôle de Traefik chaque seconde : un conteneur en drain (déploiement
      # sans coupure) ou en panne sort du trafic en ~1 s.
      - "traefik.http.services.alivaon-staging-web.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.alivaon-staging-web.loadbalancer.healthcheck.interval=1s"
      - "traefik.http.services.alivaon-staging-web.loadbalancer.healthcheck.timeout=1s"
      # 2) Chemins toujours servis par Symfony (même liste que la production).
      - "traefik.http.routers.alivaon-staging-web-symfony.rule=(Host(`staging.alivaon.com`) || Host(`www.staging.alivaon.com`)) && (PathPrefix(`/uploads/`) || PathPrefix(`/build/`) || PathPrefix(`/vandor/`) || PathPrefix(`/bundles/`) || PathPrefix(`/assets/`) || Path(`/sitemap.xml`) || Path(`/robots.txt`) || Path(`/llms.txt`) || Path(`/favicon.ico`) || Path(`/ping`) || Path(`/invitation`) || PathPrefix(`/invitation/`))"
      - "traefik.http.routers.alivaon-staging-web-symfony.priority=90"
      - "traefik.http.routers.alivaon-staging-web-symfony.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging-web-symfony.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-staging-web-symfony.middlewares=staging-web-canonical,staging-web-auth,staging-web-retry"
      - "traefik.http.routers.alivaon-staging-web-symfony.service=alivaon-staging@docker"
      # 3) API publique.
      - "traefik.http.routers.alivaon-staging-web-api-public.rule=(Host(`staging.alivaon.com`) || Host(`www.staging.alivaon.com`)) && PathPrefix(`/api/public`)"
      - "traefik.http.routers.alivaon-staging-web-api-public.priority=110"
      - "traefik.http.routers.alivaon-staging-web-api-public.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging-web-api-public.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-staging-web-api-public.middlewares=staging-web-canonical,staging-web-auth,staging-web-retry"
      - "traefik.http.routers.alivaon-staging-web-api-public.service=alivaon-staging@docker"
      # 4) Ancien EasyAdmin → back-office du staging.
      - "traefik.http.routers.alivaon-staging-web-legacy-admin.rule=(Host(`staging.alivaon.com`) || Host(`www.staging.alivaon.com`)) && (Path(`/admin`) || PathPrefix(`/admin/`) || Path(`/login`) || Path(`/logout`))"
      - "traefik.http.routers.alivaon-staging-web-legacy-admin.priority=120"
      - "traefik.http.routers.alivaon-staging-web-legacy-admin.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging-web-legacy-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-staging-web-legacy-admin.middlewares=staging-web-legacy-admin"
      - "traefik.http.routers.alivaon-staging-web-legacy-admin.service=noop@internal"
      # Anciens hôtes de prévisualisation → www.staging (301, chemin conservé).
      - "traefik.http.middlewares.staging-web-preview-gone.redirectregex.regex=^https?://(www\\.)?preview\\.staging\\.alivaon\\.com/(.*)"
      - "traefik.http.middlewares.staging-web-preview-gone.redirectregex.replacement=https://www.staging.alivaon.com/$${2}"
      - "traefik.http.middlewares.staging-web-preview-gone.redirectregex.permanent=true"
      - "traefik.http.routers.alivaon-staging-web-preview-gone.rule=Host(`preview.staging.alivaon.com`) || Host(`www.preview.staging.alivaon.com`)"
      - "traefik.http.routers.alivaon-staging-web-preview-gone.priority=10"
      - "traefik.http.routers.alivaon-staging-web-preview-gone.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging-web-preview-gone.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-staging-web-preview-gone.middlewares=staging-web-preview-gone"
      - "traefik.http.routers.alivaon-staging-web-preview-gone.service=noop@internal"

  # Back-office Next.js.
  admin:
    image: ghcr.io/alivaon/alivaon-next-admin:staging
    restart: unless-stopped
    # Ni variable ni réseau interne : le navigateur appelle l'API sur la même
    # origine (routeur alivaon-staging-admin-api), comme en production.
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.alivaon-staging-admin.rule=Host(`www.admin.staging.alivaon.com`)"
      - "traefik.http.routers.alivaon-staging-admin.priority=10"
      - "traefik.http.routers.alivaon-staging-admin.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-staging-admin.middlewares=staging-auth,staging-noindex,staging-admin-retry"
      - "traefik.http.routers.alivaon-staging-admin.service=alivaon-staging-admin"
      - "traefik.http.services.alivaon-staging-admin.loadbalancer.server.port=3000"
      # Déploiement sans coupure (workflow d'alivaon-admin) : contrôle de
      # Traefik chaque seconde (drain) et requête refusée rejouée.
      - "traefik.http.services.alivaon-staging-admin.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.alivaon-staging-admin.loadbalancer.healthcheck.interval=1s"
      - "traefik.http.services.alivaon-staging-admin.loadbalancer.healthcheck.timeout=1s"
      - "traefik.http.middlewares.staging-admin-retry.retry.attempts=3"
      # admin.staging -> www.admin.staging (301, canonique = www).
      - "traefik.http.routers.alivaon-staging-admin-canonical.rule=Host(`admin.staging.alivaon.com`)"
      - "traefik.http.routers.alivaon-staging-admin-canonical.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging-admin-canonical.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-staging-admin-canonical.middlewares=staging-admin-canonical"
      - "traefik.http.routers.alivaon-staging-admin-canonical.service=noop@internal"
      - "traefik.http.middlewares.staging-admin-canonical.redirectregex.regex=^https?://admin\\.staging\\.alivaon\\.com/(.*)"
      - "traefik.http.middlewares.staging-admin-canonical.redirectregex.replacement=https://www.admin.staging.alivaon.com/$${1}"
      - "traefik.http.middlewares.staging-admin-canonical.redirectregex.permanent=true"

  db:
    image: mysql:8.0
    restart: unless-stopped
    # Pas de --default-authentication-plugin : supprimé en MySQL 8.4+.
    env_file:
      - .env
    volumes:
      - db_data_staging:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data_staging:
  uploads_staging:
  cv_private_staging:

networks:
  traefik_proxy:
    external: true
  internal:
    internal: true
