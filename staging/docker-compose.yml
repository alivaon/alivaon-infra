# Stack STAGING — déployée dans /opt/alivaon/staging/.
# Domaine : staging.alivaon.com (protégé par basic auth Traefik).
#
# Identique à production mais : routeurs/services suffixés `-staging`,
# volume base distinct (db_data_staging) et middleware basicauth.

services:
  app:
    image: ghcr.io/alivaon/alivaon-symfony:staging
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads_staging:/var/www/html/public/uploads
      # CV des candidats — HORS docroot, jamais servis par nginx.
      - cv_private_staging:/var/www/html/var/private
    networks:
      - traefik_proxy
      - internal
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # Route staging + www.staging -> cert Let's Encrypt couvrant les 2 SANs.
      - "traefik.http.routers.alivaon-staging.rule=Host(`staging.alivaon.com`) || Host(`www.staging.alivaon.com`)"
      - "traefik.http.routers.alivaon-staging.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging.tls=true"
      - "traefik.http.routers.alivaon-staging.tls.certresolver=letsencrypt"
      # Redirige staging.alivaon.com -> www.staging.alivaon.com (canonique = www,
      # cohérent avec la prod). L'ancre ^https?://staging\.alivaon\.com/ ne matche
      # pas www.staging (qui commence par "www.") -> pas de boucle.
      # Ordre des middlewares : redirection D'ABORD, puis basic auth.
      - "traefik.http.routers.alivaon-staging.middlewares=staging-canonical,staging-auth"
      - "traefik.http.middlewares.staging-canonical.redirectregex.regex=^https?://staging\\.alivaon\\.com/(.*)"
      - "traefik.http.middlewares.staging-canonical.redirectregex.replacement=https://www.staging.alivaon.com/$${1}"
      - "traefik.http.middlewares.staging-canonical.redirectregex.permanent=true"
      # Basic auth : bloque l'indexation et l'accès public au préprod.
      # Le hash est fourni via .env (STAGING_BASICAUTH), voir .env.example.
      - "traefik.http.middlewares.staging-auth.basicauth.users=${STAGING_BASICAUTH}"
      - "traefik.http.services.alivaon-staging.loadbalancer.server.port=80"
      # ── Migration Next.js (docs/next.md) ─────────────────────────────────
      # Symfony sert aussi l'API et les fichiers sur les hôtes Next. Priorité
      # haute : ces chemins passent avant le routeur « tout le reste » du
      # conteneur Next du même hôte.
      # admin.staging : API d'administration, authentification, images.
      - "traefik.http.routers.alivaon-staging-admin-api.rule=Host(`admin.staging.alivaon.com`) && (PathPrefix(`/api/admin`) || PathPrefix(`/api/auth`) || PathPrefix(`/uploads/`))"
      - "traefik.http.routers.alivaon-staging-admin-api.priority=100"
      - "traefik.http.routers.alivaon-staging-admin-api.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging-admin-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-staging-admin-api.middlewares=staging-auth,staging-noindex"
      - "traefik.http.routers.alivaon-staging-admin-api.service=alivaon-staging"
      # preview.staging : API publique, images et fichiers SEO servis par Symfony
      # (sitemap et robots inchangés — robots en Disallow: / car APP_STAGING=1).
      - "traefik.http.routers.alivaon-staging-preview-api.rule=Host(`preview.staging.alivaon.com`) && (PathPrefix(`/api/public`) || PathPrefix(`/uploads/`) || Path(`/sitemap.xml`) || Path(`/robots.txt`) || Path(`/llms.txt`))"
      - "traefik.http.routers.alivaon-staging-preview-api.priority=100"
      - "traefik.http.routers.alivaon-staging-preview-api.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging-preview-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-staging-preview-api.middlewares=staging-auth"
      - "traefik.http.routers.alivaon-staging-preview-api.service=alivaon-staging"
      # En-tête noindex (hôtes de travail et back-office).
      - "traefik.http.middlewares.staging-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ── Front Next.js (dépôt alivaon-next) ─────────────────────────────────
  # Site public, en prévisualisation sur preview.staging tant qu'il n'a pas
  # passé le contrôle de parité SEO (www.staging reste servi par Symfony).
  web:
    image: ghcr.io/alivaon/alivaon-next-site:staging
    restart: unless-stopped
    # Variables explicites (pas d'env_file) : le front ne reçoit ni la base ni
    # les secrets Symfony.
    environment:
      API_INTERNAL_URL: http://app
      SITE_ORIGIN: https://preview.staging.alivaon.com
      NEXT_REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET}
    networks:
      - traefik_proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.alivaon-staging-preview.rule=Host(`preview.staging.alivaon.com`)"
      - "traefik.http.routers.alivaon-staging-preview.priority=10"
      - "traefik.http.routers.alivaon-staging-preview.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging-preview.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-staging-preview.middlewares=staging-auth,staging-noindex"
      - "traefik.http.routers.alivaon-staging-preview.service=alivaon-staging-web"
      - "traefik.http.services.alivaon-staging-web.loadbalancer.server.port=3000"

  # Back-office Next.js.
  admin:
    image: ghcr.io/alivaon/alivaon-next-admin:staging
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://app
      ADMIN_ORIGIN: https://admin.staging.alivaon.com
    networks:
      - traefik_proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.alivaon-staging-admin.rule=Host(`admin.staging.alivaon.com`)"
      - "traefik.http.routers.alivaon-staging-admin.priority=10"
      - "traefik.http.routers.alivaon-staging-admin.entrypoints=websecure"
      - "traefik.http.routers.alivaon-staging-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-staging-admin.middlewares=staging-auth,staging-noindex"
      - "traefik.http.routers.alivaon-staging-admin.service=alivaon-staging-admin"
      - "traefik.http.services.alivaon-staging-admin.loadbalancer.server.port=3000"

  db:
    image: mysql:8.0
    restart: unless-stopped
    # Pas de --default-authentication-plugin : supprimé en MySQL 8.4+.
    env_file:
      - .env
    volumes:
      - db_data_staging:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data_staging:
  uploads_staging:
  cv_private_staging:

networks:
  traefik_proxy:
    external: true
  internal:
    internal: true
