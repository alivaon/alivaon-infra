# Stack PRODUCTION — déployée dans /opt/alivaon/production/.
# Domaines : alivaon.com + www.alivaon.com (site Next.js `web` depuis la
#            bascule ; Symfony garde l'API publique, les fichiers, le sitemap),
#            www.admin.alivaon.com (back-office Next.js + API d'administration ;
#            admin.alivaon.com redirige en 301, canonique = www comme le site).
#
# L'image est référencée par tag mouvant `production` : le pipeline pousse
# à la fois un tag SHA (traçable) et le tag `production`, et fait un `pull`.

services:
  app:
    image: ghcr.io/alivaon/alivaon-symfony:production
    restart: unless-stopped
    env_file:
      - .env
      # Secret partagé avec le site Next.js (régénération des pages). Fichier
      # à part : modifier .env recréerait aussi db.
      - .env.next
    environment:
      NEXT_REVALIDATE_URL: http://production-site:3000/api/revalidate
    volumes:
      # Uploads utilisateurs persistants (VichUploader).
      - uploads:/var/www/html/public/uploads
      # CV des candidats — HORS docroot, jamais servis par nginx. Persistés
      # pour survivre à la recréation du conteneur à chaque déploiement.
      - cv_private:/var/www/html/var/private
    networks:
      traefik_proxy: {}   # exposition via Traefik
      # Accès à la base ; alias propre à la pile : sur traefik_proxy, « app »
      # désigne aussi le Symfony du staging (le DNS Docker renvoie les deux).
      internal:
        aliases:
          - production-api
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # Router HTTPS pour alivaon.com + www.alivaon.com
      - "traefik.http.routers.alivaon.rule=Host(`alivaon.com`) || Host(`www.alivaon.com`)"
      - "traefik.http.routers.alivaon.entrypoints=websecure"
      - "traefik.http.routers.alivaon.tls=true"
      - "traefik.http.routers.alivaon.tls.certresolver=letsencrypt"
      # Redirige alivaon.com -> www.alivaon.com (URL canonique = www).
      # L'ancre ^https?://alivaon\.com/ ne matche que l'apex (pas www., qui
      # commence par "www.") -> pas de boucle de redirection.
      - "traefik.http.routers.alivaon.middlewares=alivaon-canonical"
      - "traefik.http.middlewares.alivaon-canonical.redirectregex.regex=^https?://alivaon\\.com/(.*)"
      - "traefik.http.middlewares.alivaon-canonical.redirectregex.replacement=https://www.alivaon.com/$${1}"
      - "traefik.http.middlewares.alivaon-canonical.redirectregex.permanent=true"
      - "traefik.http.routers.alivaon.service=alivaon"
      # Port interne du conteneur (nginx).
      - "traefik.http.services.alivaon.loadbalancer.server.port=80"
      # www : l'API n'est pas exposée (même 404 Symfony qu'avant son arrivée).
      # /api/admin et /api/auth ne sont servis que sur www.admin.alivaon.com ;
      # /api/public ne s'ouvrira sur www qu'à la bascule du site Next.js.
      - "traefik.http.routers.alivaon-api-hidden.rule=(Host(`alivaon.com`) || Host(`www.alivaon.com`)) && (Path(`/api`) || PathPrefix(`/api/`))"
      - "traefik.http.routers.alivaon-api-hidden.priority=100"
      - "traefik.http.routers.alivaon-api-hidden.entrypoints=websecure"
      - "traefik.http.routers.alivaon-api-hidden.tls=true"
      - "traefik.http.routers.alivaon-api-hidden.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-api-hidden.middlewares=alivaon-canonical,alivaon-api-hidden"
      - "traefik.http.routers.alivaon-api-hidden.service=alivaon"
      - "traefik.http.middlewares.alivaon-api-hidden.replacepath.path=/api-non-disponible"
      # www.admin.alivaon.com : API d'administration, authentification et images
      # vers Symfony ; tout le reste vers le conteneur admin (Next.js).
      - "traefik.http.routers.alivaon-admin-api.rule=Host(`www.admin.alivaon.com`) && (PathPrefix(`/api/admin`) || PathPrefix(`/api/auth`) || PathPrefix(`/uploads/`))"
      - "traefik.http.routers.alivaon-admin-api.priority=100"
      - "traefik.http.routers.alivaon-admin-api.entrypoints=websecure"
      - "traefik.http.routers.alivaon-admin-api.tls=true"
      - "traefik.http.routers.alivaon-admin-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-admin-api.service=alivaon"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Site public Next.js (dépôt alivaon-site, pipeline limité à ce service).
  # Tous les routeurs de www sont portés par ce service (docs/next.md,
  # « Bascule du site ») : ils passent devant le routeur historique `alivaon`
  # de Symfony (priorité implicite 47 = longueur de sa règle). Arrêter `web`
  # les retire : www revient aussitôt au site Symfony (retour arrière).
  web:
    image: ghcr.io/alivaon/alivaon-next-site:production
    restart: unless-stopped
    # Variables explicites + le seul secret de régénération : ni base ni
    # secrets Symfony.
    env_file:
      - .env.next
    environment:
      API_INTERNAL_URL: http://production-api
      SITE_ORIGIN: https://www.alivaon.com
      GA_MEASUREMENT_ID: G-B4FFE2DZ7N
    networks:
      traefik_proxy: {}
      # Jamais « web » ni « app » entre services (voir app).
      internal:
        aliases:
          - production-site
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # Apex → www (301), déclaré ici : un redémarrage de Symfony ne retire
      # pas les middlewares du site (enseignement du staging).
      - "traefik.http.middlewares.alivaon-web-canonical.redirectregex.regex=^https?://alivaon\\.com/(.*)"
      - "traefik.http.middlewares.alivaon-web-canonical.redirectregex.replacement=https://www.alivaon.com/$${1}"
      - "traefik.http.middlewares.alivaon-web-canonical.redirectregex.permanent=true"
      # « //blog » : Symfony servait la page (200) ; Next redirigerait en 308.
      - "traefik.http.middlewares.alivaon-web-slashes.replacepathregex.regex=^/{2,}(.*)"
      - "traefik.http.middlewares.alivaon-web-slashes.replacepathregex.replacement=/$${1}"
      # Ancien EasyAdmin (/admin*, /login, /logout) → nouvel admin, 301
      # (décision du propriétaire, 24/09/2026).
      - "traefik.http.middlewares.alivaon-web-legacy-admin.redirectregex.regex=^https?://[^/]+/.*"
      - "traefik.http.middlewares.alivaon-web-legacy-admin.redirectregex.replacement=https://www.admin.alivaon.com/"
      - "traefik.http.middlewares.alivaon-web-legacy-admin.redirectregex.permanent=true"
      # 1) Tout le reste de www → Next.js.
      - "traefik.http.routers.alivaon-web.rule=Host(`alivaon.com`) || Host(`www.alivaon.com`)"
      - "traefik.http.routers.alivaon-web.priority=60"
      - "traefik.http.routers.alivaon-web.entrypoints=websecure"
      - "traefik.http.routers.alivaon-web.tls=true"
      - "traefik.http.routers.alivaon-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-web.middlewares=alivaon-web-canonical,alivaon-web-slashes"
      - "traefik.http.routers.alivaon-web.service=alivaon-web"
      - "traefik.http.services.alivaon-web.loadbalancer.server.port=3000"
      # 2) Chemins toujours servis par Symfony (même liste que la préversion
      #    du staging) : fichiers du thème et uploads, sitemap, robots, llms,
      #    favicon, ping, invitations des comptes.
      - "traefik.http.routers.alivaon-web-symfony.rule=(Host(`alivaon.com`) || Host(`www.alivaon.com`)) && (PathPrefix(`/uploads/`) || PathPrefix(`/build/`) || PathPrefix(`/vandor/`) || PathPrefix(`/bundles/`) || PathPrefix(`/assets/`) || Path(`/sitemap.xml`) || Path(`/robots.txt`) || Path(`/llms.txt`) || Path(`/favicon.ico`) || Path(`/ping`) || Path(`/invitation`) || PathPrefix(`/invitation/`))"
      - "traefik.http.routers.alivaon-web-symfony.priority=90"
      - "traefik.http.routers.alivaon-web-symfony.entrypoints=websecure"
      - "traefik.http.routers.alivaon-web-symfony.tls=true"
      - "traefik.http.routers.alivaon-web-symfony.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-web-symfony.middlewares=alivaon-web-canonical"
      - "traefik.http.routers.alivaon-web-symfony.service=alivaon@docker"
      # 3) API publique ouverte sur www ; le reste de /api reste masqué par
      #    alivaon-api-hidden (priorité 100, sur app).
      - "traefik.http.routers.alivaon-web-api-public.rule=(Host(`alivaon.com`) || Host(`www.alivaon.com`)) && PathPrefix(`/api/public`)"
      - "traefik.http.routers.alivaon-web-api-public.priority=110"
      - "traefik.http.routers.alivaon-web-api-public.entrypoints=websecure"
      - "traefik.http.routers.alivaon-web-api-public.tls=true"
      - "traefik.http.routers.alivaon-web-api-public.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-web-api-public.middlewares=alivaon-web-canonical"
      - "traefik.http.routers.alivaon-web-api-public.service=alivaon@docker"
      # 4) Ancien EasyAdmin → www.admin.alivaon.com.
      - "traefik.http.routers.alivaon-web-legacy-admin.rule=(Host(`alivaon.com`) || Host(`www.alivaon.com`)) && (Path(`/admin`) || PathPrefix(`/admin/`) || Path(`/login`) || Path(`/logout`))"
      - "traefik.http.routers.alivaon-web-legacy-admin.priority=120"
      - "traefik.http.routers.alivaon-web-legacy-admin.entrypoints=websecure"
      - "traefik.http.routers.alivaon-web-legacy-admin.tls=true"
      - "traefik.http.routers.alivaon-web-legacy-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-web-legacy-admin.middlewares=alivaon-web-legacy-admin"
      - "traefik.http.routers.alivaon-web-legacy-admin.service=noop@internal"

  # Back-office Next.js (dépôt alivaon-admin, pipeline limité à ce service).
  # Aucun secret, aucune variable : le navigateur appelle l'API sur la même
  # origine (routeur alivaon-admin-api ci-dessus). Pas de réseau `internal` :
  # le conteneur n'a pas à joindre Symfony ni la base.
  admin:
    image: ghcr.io/alivaon/alivaon-next-admin:production
    restart: unless-stopped
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.alivaon-admin.rule=Host(`www.admin.alivaon.com`)"
      - "traefik.http.routers.alivaon-admin.priority=10"
      - "traefik.http.routers.alivaon-admin.entrypoints=websecure"
      - "traefik.http.routers.alivaon-admin.tls=true"
      - "traefik.http.routers.alivaon-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-admin.middlewares=alivaon-admin-noindex"
      - "traefik.http.routers.alivaon-admin.service=alivaon-admin"
      # Déclaré ici (et non sur `app`) : un redémarrage de Symfony ne désactive
      # pas le routeur de l'admin (enseignement du staging, docs/next.md).
      - "traefik.http.middlewares.alivaon-admin-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"
      - "traefik.http.services.alivaon-admin.loadbalancer.server.port=3000"
      # admin.alivaon.com -> www.admin.alivaon.com (301, canonique = www).
      - "traefik.http.routers.alivaon-admin-canonical.rule=Host(`admin.alivaon.com`)"
      - "traefik.http.routers.alivaon-admin-canonical.entrypoints=websecure"
      - "traefik.http.routers.alivaon-admin-canonical.tls=true"
      - "traefik.http.routers.alivaon-admin-canonical.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alivaon-admin-canonical.middlewares=alivaon-admin-canonical"
      - "traefik.http.routers.alivaon-admin-canonical.service=noop@internal"
      - "traefik.http.middlewares.alivaon-admin-canonical.redirectregex.regex=^https?://admin\\.alivaon\\.com/(.*)"
      - "traefik.http.middlewares.alivaon-admin-canonical.redirectregex.replacement=https://www.admin.alivaon.com/$${1}"
      - "traefik.http.middlewares.alivaon-admin-canonical.redirectregex.permanent=true"

  db:
    image: mysql:8.0
    restart: unless-stopped
    # Pas de --default-authentication-plugin : ce flag est supprimé en MySQL 8.4+
    # et bloquerait le démarrage. L'app (PDO moderne) gère caching_sha2_password.
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      # Réseau interne UNIQUEMENT — jamais de section `ports:` exposant 3306.
      # (ufw ne protégerait pas un port publié par Docker.)
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
  uploads:
  cv_private:

networks:
  traefik_proxy:
    external: true
  internal:
    # Réseau privé app <-> db, non exposé.
    internal: true
